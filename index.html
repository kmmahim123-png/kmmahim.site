<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KM Mahim — Public Portfolio & Private Life OS</title>
    <meta name="description" content="KM Mahim personal portfolio, brand hub, and autonomous AI Life OS." />
    
    <!-- PWA & Android Meta -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KM Mahim" />

    <!-- Icons & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body class="bg-slate-950 text-slate-100 selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- PWA Service Worker Registration (Web Only - Disabled in native Android/Capacitor) -->
    <script>
      const isNativeApp = window.Capacitor !== undefined || 
                          window.location.protocol === 'capacitor:' || 
                          window.location.hostname === 'localhost';

      if ('serviceWorker' in navigator && !isNativeApp) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('PWA Service Worker registered:', reg.scope))
            .catch((err) => console.warn('PWA Service Worker registration failed:', err));
        });
      } else if (isNativeApp && 'serviceWorker' in navigator) {
        // Unregister any accidental service worker inside native WebView
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let reg of registrations) reg.unregister();
        });
      }
    </script>
  </body>
</html>
